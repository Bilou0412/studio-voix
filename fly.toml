# Serveur MCP + API /v1 + worker CPU (ffmpeg), une machine partagée toujours allumée.
app = "studio-voix"
primary_region = "cdg"

[build]

[env]
  PORT = "8080"
  JOB_CONCURRENCY = "2"
  GPU_DAILY_CAP_EUR = "10"
  # Worker CPU Fly (performance-8x) : environ 0,36 € par heure de calcul, à caler sur la facture.
  GPU_EUR_PER_SECOND = "0.0001"
  WORKER_TIMEOUT_SECONDS = "1800"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
